name: Telegram-test

# Handmatig te starten via Actions → Telegram-test → Run workflow.
# Stuurt een digest van de bestaande data; gebruikt géén Claude en dus geen abonnement.
on:
  workflow_dispatch:
    inputs:
      sinds:
        description: "Doe alsof alles vanaf deze datum nieuw is (YYYY-MM-DD)"
        required: true
        default: "2026-11-09"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Testdigest versturen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SINDS: ${{ inputs.sinds }}
        run: |
          if ! [[ "$SINDS" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Datum moet YYYY-MM-DD zijn"; exit 1; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Secrets TELEGRAM_BOT_TOKEN en/of TELEGRAM_CHAT_ID ontbreken"; exit 1; fi
          python3 scripts/telegram_digest.py --sinds "$SINDS"
