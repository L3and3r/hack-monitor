name: Hack Monitor verversen

on:
  schedule:
    - cron: "12 6 * * *"   # elke ochtend 07:12 (wintertijd) / 08:12 (zomertijd) Amsterdam
    - cron: "47 8 * * *"   # reserve: draait alleen als de eerste run vandaag niets heeft bijgewerkt
  workflow_dispatch:        # handmatig starten als de scheduler het laat afweten
    inputs:
      force:
        description: "Forceer update ook als vandaag al bijgewerkt is"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]

concurrency:
  group: hack-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Al bijgewerkt vandaag?
        id: check
        run: |
          VANDAAG=$(TZ=Europe/Amsterdam date +%Y-%m-%d)
          LAATST=$(python3 -c "import json,datetime,zoneinfo;t=json.load(open('data/meta.json'))['updated_at'];print(datetime.datetime.fromisoformat(t).astimezone(zoneinfo.ZoneInfo('Europe/Amsterdam')).date())")
          if [ "$LAATST" = "$VANDAAG" ] && [ "${{ inputs.force }}" != "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Vandaag al bijgewerkt, reserve-run slaat over."; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Huidige data bewaren
        if: steps.check.outputs.skip != 'true'
        run: |
          cp data/hacks.json /tmp/vorige.json
          echo "VANDAAG=$(TZ=Europe/Amsterdam date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Claude zoekt nieuwe incidenten
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Voer een update-run uit volgens CLAUDE.md. Vandaag is het ${{ env.VANDAAG }} (Europe/Amsterdam). Werk alleen data/hacks.json bij.
          claude_args: |
            --max-turns 250
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(python3 scripts/finalize.py:*)"

      - name: Valideren en meta.json schrijven
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/finalize.py --vorige /tmp/vorige.json --datum "$(date -u +%Y-%m-%d)"

      - name: Committen
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "hack-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Geen wijzigingen"; else
            git commit -m "Data bijgewerkt $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Telegram-digest versturen
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_digest.py --datum "$(date -u +%Y-%m-%d)" --alleen-als-nieuw

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
